<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matchday Line-up</title>
<meta name="description" content="Pick your team, formation and bench, then share the line-up to WhatsApp.">
<meta name="theme-color" content="#11643d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Line-up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: iPad landscape = pitch + dugout on the left, tabbed side panel on the right; stacks to one column when narrow. */
:root{
  --bg:#eaefe9; --surface:#ffffff; --surface-2:#f4f7f3; --ink:#152019; --muted:#5a685f; --line:#d3dbd3;
  --accent:#11643d; --accent-ink:#ffffff; --hi:#f2c12e; --danger:#b4232f;
  --grass-a:#2e8549; --grass-b:#297a42; --chalk:rgba(255,255,255,.88);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#17201b; --surface-2:#1d2822; --ink:#e5ece7; --muted:#95a49a; --line:#2b3730;
  --accent:#2fae73; --accent-ink:#06150d; --hi:#f2c12e; --danger:#ef6b74; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#17201b; --surface-2:#1d2822; --ink:#e5ece7; --muted:#95a49a; --line:#2b3730;
  --accent:#2fae73; --accent-ink:#06150d; --hi:#f2c12e; --danger:#ef6b74; color-scheme:dark;}
html,body{height:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));gap:12px}
header.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand .eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.brand h1 .vs{color:var(--muted);font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;min-height:42px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:34px;padding:5px 12px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
select.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;min-height:42px;font-weight:600}

main.board{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start;flex:1}
@media (max-width:920px){main.board{grid-template-columns:minmax(0,1fr)}}

.pitch-col{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.pitch{position:relative;aspect-ratio:68/100;width:min(100%,calc((100dvh - 260px)*.68));min-width:min(100%,300px);max-width:100%;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass-a) 0 10%,var(--grass-b) 10% 20%);touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 30px -14px rgba(0,0,0,.45)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pitch .attack{position:absolute;top:8px;left:10px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);pointer-events:none}

.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:26%;touch-action:none;cursor:grab;z-index:2}
.tok .disc,.bench-slot .disc,.ghost .disc{width:clamp(38px,52%,62px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(17px,2.4vw,24px);
  background:var(--kit);color:var(--kit-ink);border:2.5px solid rgba(255,255,255,.95);box-shadow:0 3px 8px rgba(0,0,0,.35);position:relative}
.tok .disc .cap,.bench-slot .disc .cap{position:absolute;top:-5px;right:-7px;background:var(--hi);color:#1b1500;font-size:11px;border-radius:6px;padding:1px 4px;line-height:1.2;font-family:var(--display);font-weight:700}
.tok .name{font-family:var(--display);font-weight:600;font-size:clamp(13px,1.6vw,16px);line-height:1.1;color:#fff;background:rgba(8,25,14,.72);padding:2px 7px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .pos{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.85);line-height:1}
.tok.empty .disc{background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.75);box-shadow:none;color:#fff;font-size:14px;letter-spacing:.05em}
.tok.sel .disc,.bench-slot.sel .disc,.pool-item.sel{box-shadow:0 0 0 4px var(--hi),0 3px 8px rgba(0,0,0,.35)}
.tok.over .disc,.bench-slot.over .disc{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--hi)}
.tok.dragging,.bench-slot.dragging,.pool-item.dragging{opacity:.3;pointer-events:none}
.tok .note-dot{position:absolute;top:-2px;left:calc(50% - clamp(19px,26%,31px) - 4px);width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent)}

.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);display:flex;flex-direction:column;align-items:center;gap:3px;width:90px}
.ghost .name{font-family:var(--display);font-weight:600;font-size:15px;color:#fff;background:rgba(8,25,14,.85);padding:2px 7px;border-radius:6px;white-space:nowrap}
.ghost .disc{width:58px}

.dugout{width:100%;max-width:min(100%,760px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 14px}
.dugout-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.label{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{border:0;background:transparent;width:38px;height:34px;font-size:20px;font-weight:600}
.stepper span{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.bench-slot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;background:var(--surface-2);touch-action:none;cursor:grab;min-width:0}
.bench-slot .disc{width:46px;font-size:19px}
.bench-slot .bname{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench-slot.empty .disc{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-size:13px}
.bench-slot.empty .bname{color:var(--muted)}
.empty-note{color:var(--muted);font-size:14px;margin:0}

.hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.hint span{font-size:14px}
.hint .btn{min-height:34px;padding:4px 12px;font-size:14px;background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}

aside.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0;position:sticky;top:12px;max-height:calc(100dvh - 24px)}
@media (max-width:920px){aside.panel{position:static;max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 6px 0}
.tabs button{flex:1;border:0;background:transparent;padding:12px 6px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel-body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0}
.section{display:flex;flex-direction:column;gap:8px}
.pool{display:flex;flex-direction:column;gap:6px;min-height:56px;padding:6px;border-radius:10px;border:2px dashed transparent}
.pool.over{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 10%,transparent)}
.pool-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);touch-action:pan-y;cursor:grab}
.pool-item .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--kit);color:var(--kit-ink);font-family:var(--display);font-weight:700;flex:none}
.pool-item .pname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pool-item .where{font-size:12px;color:var(--muted);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.pool-item.assigned{background:var(--surface-2)}
.pool-item.over{box-shadow:0 0 0 3px var(--hi)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;min-height:42px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.muted{color:var(--muted);font-size:14px;margin:0}
.saved-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.saved-item .sname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.example-banner{background:color-mix(in srgb,var(--hi) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--hi) 60%,var(--line));border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.example-banner p{margin:0;flex:1 1 180px}

.sheet-wrap{position:fixed;inset:0;z-index:80;background:rgba(5,12,8,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sheet h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05}
.sheet .sub{margin:-8px 0 0;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:12px 4px;font-family:var(--display);font-weight:600;font-size:18px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.share-img{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.share-msg{white-space:pre-wrap;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:180px;overflow:auto;margin:0;user-select:text;-webkit-user-select:text}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:120;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:no-preference){.tok{transition:left .18s ease,top .18s ease}.tok.nomotion{transition:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <span class="eyebrow" id="eyebrow">Matchday line-up</span>
      <h1 id="title">Team</h1>
    </div>
    <div class="tools">
      <select class="pill" id="formationSel" aria-label="Formation"></select>
      <button class="btn" id="setupBtn" type="button">New match</button>
      <button class="btn primary" id="shareBtn" type="button">Share line-up</button>
    </div>
  </header>

  <main class="board">
    <div class="pitch-col">
      <div class="pitch" id="pitch" data-loc="pitcharea">
        <svg class="lines" viewBox="0 0 68 100" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="rgba(255,255,255,.88)" stroke-width=".35">
            <rect x="2" y="2" width="64" height="96"/>
            <line x1="2" y1="50" x2="66" y2="50"/>
            <ellipse cx="34" cy="50" rx="8.7" ry="8.3"/>
            <rect x="13.85" y="2" width="40.3" height="15.7"/>
            <rect x="24.85" y="2" width="18.3" height="5.2"/>
            <rect x="13.85" y="82.3" width="40.3" height="15.7"/>
            <rect x="24.85" y="92.8" width="18.3" height="5.2"/>
            <path d="M27.1 17.7 A8.7 8.3 0 0 0 40.9 17.7"/>
            <path d="M27.1 82.3 A8.7 8.3 0 0 1 40.9 82.3"/>
          </g>
          <g fill="rgba(255,255,255,.88)"><circle cx="34" cy="50" r=".6"/><circle cx="34" cy="12" r=".5"/><circle cx="34" cy="88" r=".5"/></g>
        </svg>
        <span class="attack">Attacking ↑</span>
        <div id="tokens"></div>
      </div>
      <section class="dugout" aria-label="Substitutes bench">
        <div class="dugout-head">
          <span class="label" id="benchLabel">Bench</span>
          <div class="row">
            <span class="muted">Slots</span>
            <div class="stepper"><button type="button" id="benchMinus" aria-label="Fewer bench slots">−</button><span id="benchCount">5</span><button type="button" id="benchPlus" aria-label="More bench slots">+</button></div>
          </div>
        </div>
        <div class="bench" id="bench"></div>
      </section>
    </div>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-squad" aria-selected="true" data-tab="squad">Squad</button>
        <button role="tab" id="tab-plan" aria-selected="false" data-tab="plan">Instructions</button>
        <button role="tab" id="tab-match" aria-selected="false" data-tab="match">Match</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>
</div>

<div id="hint" class="hint" hidden><span id="hintText">Tap another player or slot to swap</span><button class="btn" id="hintEdit" type="button">Edit</button><button class="btn" id="hintCancel" type="button">Done</button></div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){

const EXAMPLE_NAMES=[['Seán Kelly',1],['Darragh Moore',2],['Liam Doyle',4],['Cian Walsh',5],['Mark Brennan',3],['Eoin Fitzgerald',7],['Ryan Nolan',8],['Jamie Quinn',6],['Shane Murphy',11],['Aaron Flood',9],['Niall Kearney',10],['Ben Gallagher',12],['Kevin Dunne',14],['Oisín Ryan',15],['Paddy Hogan',16],['Tommy Byrne',17]];

const KEY='matchday.lineup.v1', SAVED_KEY='matchday.lineup.saved.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function nextSaturday(){const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));return d.toISOString().slice(0,10)}
function exampleState(){
  const players=EXAMPLE_NAMES.map(([name,num])=>({id:uid(),name,num:String(num),note:''}));
  const s={v:1,example:true,team:'Riverside Rovers',opp:'Ballyhale Athletic',ha:'Home',date:nextSaturday(),ko:'11:00',meet:'10:15',venue:'Riverside Park, Pitch 2',
    kit:'#d6262f',gkKit:'#f2c12e',format:11,formation:'4-4-2',slots:[],bench:new Array(5).fill(null),players,captain:null,
    tags:['Press high','Talk to each other'],notes:'Warm-up starts 10:20. Shin pads and both kits, please.',corners:null,freeKicks:null,penalties:null};
  applyFormation(s,true);
  s.slots.forEach((sl,i)=>sl.pid=players[i]?players[i].id:null);
  s.bench=s.bench.map((_,i)=>players[11+i]?players[11+i].id:null);
  players[3].note='Organise the back line and call the offside.';
  s.captain=players[3].id; s.corners=players[10].id; s.freeKicks=players[10].id; s.penalties=players[9].id;
  return s;
}
function applyFormation(s,keepPlayers){
  const shape=FORMATIONS[s.format][s.formation]||Object.values(FORMATIONS[s.format])[0];
  if(!FORMATIONS[s.format][s.formation]) s.formation=Object.keys(FORMATIONS[s.format])[0];
  const old=s.slots||[];
  s.slots=shape.map(([label,x,y],i)=>({label,x,y,pid:keepPlayers&&old[i]?old[i].pid:null}));
}

let S=store.get(KEY);
const firstRun=!S||!S.v;
if(firstRun) S=exampleState();
let sel=null, tab='squad', drag=null;
const $=id=>document.getElementById(id);
function save(){store.set(KEY,S)}
const P=id=>S.players.find(p=>p.id===id)||null;
function inkFor(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>160?'#121212':'#ffffff'}
function shortName(p){if(!p)return'';const parts=p.name.trim().split(/\s+/);return parts.length>1?parts[parts.length-1]:parts[0]}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isGK(i){return S.slots[i]&&S.slots[i].label==='GK'}

/* ---------- Locations: pitch slot, bench slot or squad pool ---------- */
const sameLoc=(a,b)=>a&&b&&a.kind===b.kind&&a.i===b.i&&a.pid===b.pid;
function getPid(l){if(l.kind==='pitch')return S.slots[l.i].pid;if(l.kind==='bench')return S.bench[l.i];if(l.kind==='pool')return l.pid;return null}
function setPid(l,pid){if(l.kind==='pitch')S.slots[l.i].pid=pid;else if(l.kind==='bench')S.bench[l.i]=pid}
function locOf(pid){let i=S.slots.findIndex(s=>s.pid===pid);if(i>=0)return{kind:'pitch',i};i=S.bench.indexOf(pid);if(i>=0)return{kind:'bench',i};return{kind:'pool',pid}}
function swap(a,b){
  if(sameLoc(a,b))return;
  // A squad player tapped/dragged from the list may already be placed; resolve to their real spot.
  if(a.kind==='pool')a=locOf(a.pid); if(b.kind==='pool')b=locOf(b.pid);
  if(a.kind==='pool'&&b.kind==='pool')return;
  const pa=getPid(a),pb=getPid(b);
  setPid(a,pb);setPid(b,pa);
}
function parseLoc(str){if(!str)return null;const [k,v]=str.split(':');if(k==='pitch'||k==='bench')return{kind:k,i:+v};if(k==='pool')return{kind:'pool',pid:v};return{kind:k}}
function locStr(l){return l.kind==='pool'?'pool:'+l.pid:l.kind+':'+l.i}

/* ---------- Render ---------- */
function render(){
  document.documentElement.style.setProperty('--kit',S.kit);
  document.documentElement.style.setProperty('--kit-ink',inkFor(S.kit));
  $('title').innerHTML=S.opp?`${esc(S.team||'My team')} <span class="vs">v</span> ${esc(S.opp)}`:esc(S.team||'My team');
  const when=[fmtDate(S.date),S.ko&&('KO '+S.ko)].filter(Boolean).join(' · ');
  $('eyebrow').textContent=[S.format+'-a-side',S.ha,when].filter(Boolean).join(' · ');
  const fs=$('formationSel');
  fs.innerHTML=Object.keys(FORMATIONS[S.format]).map(f=>`<option ${f===S.formation?'selected':''}>${f}</option>`).join('');
  renderTokens();renderBench();renderPanel();renderHint();
}
function fmtDate(d){if(!d)return'';const t=new Date(d+'T12:00:00');if(isNaN(t))return d;return t.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function discStyle(gk){const k=gk?S.gkKit:S.kit;return `--kit:${k};--kit-ink:${inkFor(k)}`}
function renderTokens(){
  $('tokens').innerHTML=S.slots.map((s,i)=>{
    const p=P(s.pid),l={kind:'pitch',i},isSel=sel&&sameLoc(sel,l);
    if(!p)return `<div class="tok empty${isSel?' sel':''}" data-loc="pitch:${i}" style="left:${s.x}%;top:${s.y}%"><div class="disc">${esc(s.label)}</div><span class="pos">Tap to fill</span></div>`;
    return `<div class="tok${isSel?' sel':''}" data-loc="pitch:${i}" style="left:${s.x}%;top:${s.y}%;${discStyle(isGK(i))}" aria-label="${esc(s.label)} ${esc(p.name)}">
      <div class="disc">${esc(p.num||'')}${S.captain===p.id?'<span class="cap">C</span>':''}</div>
      <span class="name">${esc(shortName(p))}</span><span class="pos">${esc(s.label)}</span></div>`;
  }).join('');
}
function renderBench(){
  $('benchCount').textContent=S.bench.length;
  $('benchLabel').textContent=`Bench · ${S.bench.filter(Boolean).length}/${S.bench.length}`;
  if(!S.bench.length){$('bench').innerHTML='<p class="empty-note">No bench slots. Use + to add some.</p>';return}
  $('bench').innerHTML=S.bench.map((pid,i)=>{
    const p=P(pid),isSel=sel&&sameLoc(sel,{kind:'bench',i});
    if(!p)return `<div class="bench-slot empty${isSel?' sel':''}" data-loc="bench:${i}"><div class="disc">SUB</div><span class="bname">Empty</span></div>`;
    return `<div class="bench-slot${isSel?' sel':''}" data-loc="bench:${i}"><div class="disc">${esc(p.num||'')}${S.captain===p.id?'<span class="cap">C</span>':''}</div><span class="bname">${esc(shortName(p))}</span></div>`;
  }).join('');
}
function renderHint(){
  if(!sel){$('hint').hidden=true;return}
  const pid=getPid(sel)||(sel.kind==='pool'?sel.pid:null);
  $('hintText').textContent=pid?`${shortName(P(pid))} selected · tap another spot to swap`:'Empty slot selected · tap a player to put them here';
  $('hintEdit').hidden=false;
  $('hint').hidden=false;
}

function renderPanel(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const body=$('panelBody');
  if(tab==='squad')body.innerHTML=squadHTML();
  else if(tab==='plan')body.innerHTML=planHTML();
  else body.innerHTML=matchHTML();
}
function squadHTML(){
  const placed=new Set([...S.slots.map(s=>s.pid),...S.bench].filter(Boolean));
  const avail=S.players.filter(p=>!placed.has(p.id)).sort(byNum);
  const inTeam=S.players.filter(p=>placed.has(p.id)).sort(byNum);
  const item=(p)=>{const l=locOf(p.id);const where=l.kind==='pitch'?S.slots[l.i].label:l.kind==='bench'?'Bench':'';
    const isSel=sel&&((sel.kind==='pool'&&sel.pid===p.id)||sameLoc(sel,l));
    return `<div class="pool-item${where?' assigned':''}${isSel?' sel':''}" data-loc="pool:${p.id}"><span class="num">${esc(p.num||'–')}</span><span class="pname">${esc(p.name)}</span>${where?`<span class="where">${esc(where)}</span>`:''}</div>`};
  return `${S.example?`<div class="example-banner"><p>This is an example squad. Clear it and add your own players.</p><button class="btn small" data-act="clearExample">Clear example</button></div>`:''}
  <div class="section"><span class="label">Available · ${avail.length}</span>
    <p class="muted">Drag a player onto the pitch or bench, or tap them then tap a spot.</p>
    <div class="pool" data-loc="poolarea">${avail.map(item).join('')||'<p class="muted" style="padding:8px">Everyone is picked. Drag a player here to take them out of the team.</p>'}</div></div>
  <div class="section"><span class="label">Add players</span>
    <div class="row"><div class="field" style="flex:0 0 70px"><label for="newNum">No.</label><input id="newNum" inputmode="numeric" maxlength="3"></div>
    <div class="field"><label for="newName">Name</label><input id="newName" autocomplete="off" placeholder="e.g. Jack Ryan"></div></div>
    <div class="row"><button class="btn small primary" data-act="addPlayer">Add player</button><button class="btn small" data-act="bulk">Paste a list</button></div></div>
  <div class="section"><span class="label">In the squad · ${inTeam.length}</span><div class="pool">${inTeam.map(item).join('')||'<p class="muted" style="padding:8px">No one picked yet.</p>'}</div></div>`;
}
function byNum(a,b){return (parseInt(a.num)||999)-(parseInt(b.num)||999)||a.name.localeCompare(b.name)}
function playerOptions(cur){return `<option value="">—</option>`+S.players.slice().sort(byNum).map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.num?p.num+' · ':'')}${esc(p.name)}</option>`).join('')}
function planHTML(){
  const notes=S.players.filter(p=>p.note);
  return `<div class="section"><span class="label">Team instructions</span>
    <div class="chips">${TAGS.map(t=>`<button class="chip" data-tag="${esc(t)}" aria-pressed="${S.tags.includes(t)}">${esc(t)}</button>`).join('')}</div></div>
  <div class="section"><div class="field"><label for="notes">Notes for the group</label><textarea id="notes" data-bind="notes" placeholder="Meeting point, what to bring, focus for the day">${esc(S.notes)}</textarea></div></div>
  <div class="section"><span class="label">Roles &amp; set pieces</span>
    <div class="row"><div class="field"><label for="captain">Captain</label><select id="captain" data-bind="captain">${playerOptions(S.captain)}</select></div>
    <div class="field"><label for="corners">Corners</label><select id="corners" data-bind="corners">${playerOptions(S.corners)}</select></div></div>
    <div class="row"><div class="field"><label for="freeKicks">Free kicks</label><select id="freeKicks" data-bind="freeKicks">${playerOptions(S.freeKicks)}</select></div>
    <div class="field"><label for="penalties">Penalties</label><select id="penalties" data-bind="penalties">${playerOptions(S.penalties)}</select></div></div></div>
  <div class="section"><span class="label">Individual instructions</span>
    <p class="muted">Tap a player on the pitch twice to give them a personal instruction.</p>
    ${notes.map(p=>`<div class="saved-item"><span class="sname">${esc(p.name)}: <span style="font-weight:400">${esc(p.note)}</span></span></div>`).join('')}</div>`;
}
function matchHTML(){
  const saved=store.get(SAVED_KEY)||[];
  return `<div class="section"><span class="label">Fixture</span>
    <div class="row"><div class="field"><label for="team">Your team</label><input id="team" data-bind="team" value="${esc(S.team)}"></div>
    <div class="field"><label for="opp">Opponent</label><input id="opp" data-bind="opp" value="${esc(S.opp)}"></div></div>
    <div class="row"><div class="field"><label for="ha">Home or away</label><select id="ha" data-bind="ha">${['Home','Away','Neutral'].map(o=>`<option ${o===S.ha?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field"><label for="date">Date</label><input id="date" type="date" data-bind="date" value="${esc(S.date)}"></div></div>
    <div class="row"><div class="field"><label for="meet">Meet time</label><input id="meet" type="time" data-bind="meet" value="${esc(S.meet)}"></div>
    <div class="field"><label for="ko">Kick-off</label><input id="ko" type="time" data-bind="ko" value="${esc(S.ko)}"></div></div>
    <div class="field"><label for="venue">Venue</label><input id="venue" data-bind="venue" value="${esc(S.venue)}"></div></div>
  <div class="section"><span class="label">Kit colour</span>
    <div class="swatches">${KITS.map(([c,n])=>`<button class="swatch" style="background:${c}" data-kit="${c}" aria-label="${n}" aria-pressed="${c===S.kit}"></button>`).join('')}</div>
    <span class="label" style="margin-top:6px">Goalkeeper</span>
    <div class="swatches">${GK_KITS.map(([c,n])=>`<button class="swatch" style="background:${c}" data-gkkit="${c}" aria-label="${n}" aria-pressed="${c===S.gkKit}"></button>`).join('')}</div></div>
  <div class="section"><span class="label">Pitch</span>
    <div class="row"><button class="btn small" data-act="resetPos">Reset positions to ${esc(S.formation)}</button><button class="btn small" data-act="clearPitch">Clear the pitch</button></div></div>
  <div class="section"><span class="label">Saved line-ups</span>
    <div class="row"><div class="field"><label for="saveName">Name</label><input id="saveName" value="${esc((S.opp?'v '+S.opp:S.team)+(S.date?' · '+fmtDate(S.date):''))}"></div></div>
    <div class="row"><button class="btn small primary" data-act="saveLineup">Save this line-up</button></div>
    ${saved.length?saved.map((x,i)=>`<div class="saved-item"><span class="sname">${esc(x.name)}</span><button class="btn small" data-act="load" data-i="${i}">Load</button><button class="btn small danger" data-act="delSaved" data-i="${i}">${pendingDelete===i?'Confirm':'Delete'}</button></div>`).join(''):'<p class="muted">Nothing saved yet. Saved line-ups stay on this device.</p>'}</div>`;
}
let pendingDelete=null;

/* ---------- Pointer: drag to move/swap, tap to select/swap ---------- */
function onDown(e){
  const el=e.target.closest('[data-loc]');
  if(!el)return;
  const loc=parseLoc(el.dataset.loc);
  if(!loc||loc.kind==='pitcharea'||loc.kind==='poolarea'){ if(loc&&loc.kind==='pitcharea'&&sel&&!drag){sel=null;renderAll();} return;}
  if(e.button>0)return;
  drag={loc,el,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,over:null,id:e.pointerId};
  if(loc.kind!=='pool')e.preventDefault();
  window.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onCancel);
}
function makeGhost(loc){
  const pid=getPid(loc)||(loc.kind==='pool'?loc.pid:null);const p=P(pid);
  const g=document.createElement('div');g.className='ghost';
  const gk=loc.kind==='pitch'&&isGK(loc.i);
  g.innerHTML=p?`<div class="disc" style="${discStyle(gk)}">${esc(p.num||'')}</div><span class="name">${esc(shortName(p))}</span>`:`<div class="disc" style="background:rgba(0,0,0,.25);border-style:dashed">${loc.kind==='pitch'?esc(S.slots[loc.i].label):'SUB'}</div>`;
  document.body.appendChild(g);return g;
}
function onMove(e){
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moved){
    if(Math.hypot(dx,dy)<8)return;
    // Empty bench slots and squad items with no player can't be dragged.
    const pid=getPid(drag.loc)||(drag.loc.kind==='pool'?drag.loc.pid:null);
    if(!pid&&drag.loc.kind!=='pitch'){return}
    drag.moved=true;drag.ghost=makeGhost(drag.loc);drag.el.classList.add('dragging');
  }
  e.preventDefault();
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  const t=targetEl(e.clientX,e.clientY);
  if(drag.over&&drag.over!==t)drag.over.classList.remove('over');
  if(t&&t!==drag.over)t.classList.add('over');
  drag.over=t;
}
function targetEl(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const t=el.closest('[data-loc]');if(!t||t===drag.el)return null;
  const l=parseLoc(t.dataset.loc);if(!l||l.kind==='pitcharea')return null;
  return t;
}
function onCancel(){cleanupDrag();renderAll()}
function cleanupDrag(){
  window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onCancel);
  if(drag){if(drag.ghost)drag.ghost.remove();if(drag.over)drag.over.classList.remove('over');drag.el.classList.remove('dragging')}
}
function onUp(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;cleanupDrag();drag=null;
  if(!d.moved){tap(d.loc);return}
  const t=d.over;
  if(t){
    const l=parseLoc(t.dataset.loc);
    if(l.kind==='poolarea'){ if(d.loc.kind!=='pool')setPid(d.loc,null) }
    else swap(d.loc,l);
  } else if(d.loc.kind==='pitch'){
    const r=$('pitch').getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
      const s=S.slots[d.loc.i];
      s.x=Math.round(Math.min(95,Math.max(5,(e.clientX-r.left)/r.width*100))*10)/10;
      s.y=Math.round(Math.min(96,Math.max(4,(e.clientY-r.top)/r.height*100))*10)/10;
      document.querySelector(`[data-loc="pitch:${d.loc.i}"]`)?.classList.add('nomotion');
    }
  } else if(d.loc.kind==='pool'){
    // Dropped a squad player on open grass: fill the nearest empty position.
    const r=$('pitch').getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
      const px=(e.clientX-r.left)/r.width*100,py=(e.clientY-r.top)/r.height*100;
      let best=-1,bd=1e9;S.slots.forEach((s,i)=>{if(!s.pid){const dd=(s.x-px)**2+(s.y-py)**2;if(dd<bd){bd=dd;best=i}}});
      if(best>=0)swap(d.loc,{kind:'pitch',i:best});
    }
  }
  sel=null;save();renderAll();
}
function tap(loc){
  if(sel&&sameLoc(sel,loc)){openEditor(loc);return}
  if(sel){
    if(sel.kind==='pool'&&loc.kind==='pool'){sel=loc;renderAll();return}
    swap(sel,loc);sel=null;save();renderAll();return;
  }
  sel=loc;renderAll();
}
function renderAll(){render()}

/* ---------- Sheets ---------- */
function openSheet(html,onMount){
  const root=$('sheetRoot');
  root.innerHTML=`<div class="sheet-wrap" id="sheetWrap"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('sheetWrap').addEventListener('pointerdown',e=>{if(e.target.id==='sheetWrap')closeSheet()});
  onMount&&onMount(root);
  const f=root.querySelector('input,select,button');f&&f.focus({preventScroll:true});
}
function closeSheet(){$('sheetRoot').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('sheetRoot').innerHTML)closeSheet();else if(sel){sel=null;render()}}});

function openEditor(loc){
  if(loc.kind==='pool')loc=locOf(loc.pid);
  const pid=loc.kind==='pool'?loc.pid:getPid(loc);
  const p=P(pid);const slot=loc.kind==='pitch'?S.slots[loc.i]:null;
  const where=slot?slot.label:loc.kind==='bench'?'Bench':'Not picked';
  openSheet(`<h2>${p?esc(p.name):'Empty '+esc(where)+' slot'}</h2><p class="sub">${esc(where)}</p>
    ${slot?`<div class="field"><label for="edLabel">Position label</label><input id="edLabel" maxlength="5" value="${esc(slot.label)}"></div>`:''}
    ${loc.kind!=='pool'?`<div class="field"><label for="edPlayer">Player in this spot</label><select id="edPlayer">${playerOptions(pid)}</select></div>`:''}
    ${p?`<div class="row"><div class="field" style="flex:0 0 80px"><label for="edNum">No.</label><input id="edNum" inputmode="numeric" maxlength="3" value="${esc(p.num)}"></div>
      <div class="field"><label for="edName">Name</label><input id="edName" value="${esc(p.name)}"></div></div>
      <div class="field"><label for="edNote">Instruction for ${esc(shortName(p))}</label><textarea id="edNote" placeholder="e.g. Mark their number 9 at set pieces">${esc(p.note||'')}</textarea></div>
      <label class="row" style="gap:10px"><input type="checkbox" id="edCap" ${S.captain===p.id?'checked':''} style="width:22px;height:22px"> Captain</label>`:''}
    <div class="sheet-actions">
      ${p&&loc.kind!=='pool'?`<button class="btn danger" id="edRemove">Take out of ${loc.kind==='bench'?'bench':'team'}</button>`:''}
      ${p&&loc.kind==='pool'?`<button class="btn danger" id="edDelete">Delete from squad</button>`:''}
      <button class="btn" id="edCancel">Cancel</button><button class="btn primary" id="edSave">Save</button></div>`,()=>{
    $('edCancel').onclick=()=>{closeSheet();sel=null;render()};
    if($('edRemove'))$('edRemove').onclick=()=>{setPid(loc,null);finish()};
    if($('edDelete'))$('edDelete').onclick=()=>{
      if($('edDelete').dataset.armed){S.players=S.players.filter(x=>x.id!==p.id);['captain','corners','freeKicks','penalties'].forEach(k=>{if(S[k]===p.id)S[k]=null});finish()}
      else{$('edDelete').dataset.armed='1';$('edDelete').textContent='Tap again to delete'}};
    $('edSave').onclick=()=>{
      if(slot&&$('edLabel').value.trim())slot.label=$('edLabel').value.trim().toUpperCase();
      if(p){p.num=$('edNum').value.trim();p.name=$('edName').value.trim()||p.name;p.note=$('edNote').value.trim();
        if($('edCap').checked)S.captain=p.id;else if(S.captain===p.id)S.captain=null;}
      if($('edPlayer')){const np=$('edPlayer').value||null;if(np!==pid){if(np){swap(loc,locOf(np))}else setPid(loc,null)}}
      finish();
    };
  });
  function finish(){closeSheet();sel=null;save();render()}
}

function openSetup(first){
  const st={format:S.format,formation:S.formation,bench:S.bench.length||5,team:S.team};
  const draw=()=>{
    const forms=Object.keys(FORMATIONS[st.format]);if(!forms.includes(st.formation))st.formation=forms[0];
    openSheet(`<h2>${first?'Set up your team':'New match'}</h2><p class="sub">Pick the format, a starting shape and how many subs you can name. You can change all of this later.</p>
      <div class="field"><label for="suTeam">Team name</label><input id="suTeam" value="${esc(st.team)}"></div>
      <div class="section"><span class="label">Format</span><div class="seg">${[5,7,9,11].map(n=>`<button data-fmt="${n}" aria-pressed="${n===st.format}">${n}-a-side</button>`).join('')}</div></div>
      <div class="section"><span class="label">Formation</span><div class="chips">${forms.map(f=>`<button class="chip" data-form="${f}" aria-pressed="${f===st.formation}">${f}</button>`).join('')}</div></div>
      <div class="section"><span class="label">Bench slots</span><div class="row"><div class="stepper"><button id="suMinus" aria-label="Fewer">−</button><span id="suBench">${st.bench}</span><button id="suPlus" aria-label="More">+</button></div><span class="muted">Check your league's limit on named subs.</span></div></div>
      ${first?'':`<p class="muted">Your squad is kept. Starting places refill in shirt-number order; fixture details stay until you change them.</p>`}
      <div class="sheet-actions">${first?'':'<button class="btn" id="suCancel">Cancel</button>'}<button class="btn primary" id="suGo">${first?'Open the board':'Set up line-up'}</button></div>`,(root)=>{
      root.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{st.team=$('suTeam').value;st.format=+b.dataset.fmt;draw()});
      root.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{st.team=$('suTeam').value;st.formation=b.dataset.form;draw()});
      $('suMinus').onclick=()=>{st.bench=Math.max(0,st.bench-1);$('suBench').textContent=st.bench};
      $('suPlus').onclick=()=>{st.bench=Math.min(16,st.bench+1);$('suBench').textContent=st.bench};
      if($('suCancel'))$('suCancel').onclick=closeSheet;
      $('suGo').onclick=()=>{
        S.team=$('suTeam').value.trim()||S.team;
        if(first){
          const keep=S.format===st.format;S.format=st.format;S.formation=st.formation;applyFormation(S,keep);resizeBench(st.bench);
          if(!keep)autoFill();
        } else {
          S.format=st.format;S.formation=st.formation;S.slots=[];applyFormation(S,false);S.bench=new Array(st.bench).fill(null);autoFill();
        }
        sel=null;save();closeSheet();render();
      };
    });
  };
  draw();
}
function autoFill(){
  const placed=new Set([...S.slots.map(s=>s.pid),...S.bench].filter(Boolean));
  const pool=S.players.filter(p=>!placed.has(p.id)).sort(byNum);
  S.slots.forEach(s=>{if(!s.pid&&pool.length)s.pid=pool.shift().id});
  S.bench=S.bench.map(b=>b||(pool.length?pool.shift().id:null));
}
function resizeBench(n){
  if(n>S.bench.length)S.bench=S.bench.concat(new Array(n-S.bench.length).fill(null));
  else S.bench=S.bench.slice(0,n);
}

function bulkSheet(){
  openSheet(`<h2>Paste your squad</h2><p class="sub">One player per line. Put the shirt number first if you have it, e.g. “7 Jack Ryan”.</p>
    <div class="field"><label for="bulkText">Players</label><textarea id="bulkText" style="min-height:200px" placeholder="1 Seán Kelly&#10;2 Darragh Moore&#10;Liam Doyle"></textarea></div>
    <label class="row" style="gap:10px"><input type="checkbox" id="bulkReplace" style="width:22px;height:22px"> Replace the current squad</label>
    <div class="sheet-actions"><button class="btn" id="bkCancel">Cancel</button><button class="btn primary" id="bkGo">Add players</button></div>`,()=>{
    $('bkCancel').onclick=closeSheet;
    $('bkGo').onclick=()=>{
      const lines=$('bulkText').value.split(/\n/).map(l=>l.trim()).filter(Boolean);
      if($('bulkReplace').checked)clearSquad();
      lines.forEach(l=>{const m=l.match(/^#?(\d{1,3})[\s.\-–:)]+(.+)$/);S.players.push(m?{id:uid(),num:m[1],name:m[2].trim(),note:''}:{id:uid(),num:'',name:l,note:''})});
      S.example=false;save();closeSheet();render();toast(`Added ${lines.length} player${lines.length===1?'':'s'}`);
    };
  });
}
function clearSquad(){S.players=[];S.slots.forEach(s=>s.pid=null);S.bench=S.bench.map(()=>null);S.captain=S.corners=S.freeKicks=S.penalties=null;S.example=false}

/* ---------- Share: image + WhatsApp message ---------- */
function messageText(){
  const L=[];
  L.push(`*${S.team||'Line-up'}${S.opp?' v '+S.opp:''}*`);
  const when=[fmtDate(S.date),S.meet&&('Meet '+S.meet),S.ko&&('KO '+S.ko)].filter(Boolean).join(' · ');
  if(when)L.push(when);
  if(S.venue)L.push(S.venue+(S.ha?` (${S.ha})`:''));
  L.push('');L.push(`*Starting ${S.format} (${S.formation})*`);
  S.slots.map((s,i)=>({s,i})).sort((a,b)=>b.s.y-a.s.y||a.s.x-b.s.x).forEach(({s})=>{const p=P(s.pid);L.push(`${s.label} – ${p?(p.num?p.num+' ':'')+p.name+(S.captain===p.id?' (C)':''):'TBC'}`)});
  const subs=S.bench.map(P).filter(Boolean);
  if(subs.length){L.push('');L.push('*Subs*');subs.forEach(p=>L.push(`${p.num?p.num+' ':''}${p.name}${S.captain===p.id?' (C)':''}`))}
  const sp=[['Corners',S.corners],['Free kicks',S.freeKicks],['Penalties',S.penalties]].filter(x=>P(x[1]));
  if(sp.length){L.push('');L.push('*Set pieces*');sp.forEach(([k,v])=>L.push(`${k}: ${P(v).name}`))}
  const notes=S.players.filter(p=>p.note&&locOf(p.id).kind!=='pool');
  if(S.tags.length||S.notes||notes.length){L.push('');L.push('*Instructions*');S.tags.forEach(t=>L.push('• '+t));notes.forEach(p=>L.push(`• ${shortName(p)}: ${p.note}`));if(S.notes)L.push(S.notes)}
  return L.join('\n');
}
function wrapLines(ctx,text,maxW){const out=[];String(text).split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function buildImage(){
  try{await document.fonts.load('700 40px "Barlow Condensed"');await document.fonts.load('500 24px "Barlow"')}catch(e){}
  const W=1080,pad=56,DF='"Barlow Condensed","Arial Narrow",sans-serif',BF='"Barlow",system-ui,sans-serif';
  const pw=W-pad*2-120,ph=Math.round(pw*100/68),px=(W-pw)/2;
  const meas=document.createElement('canvas').getContext('2d');
  meas.font=`500 30px ${BF}`;
  const instr=[...S.tags.map(t=>'• '+t),...S.players.filter(p=>p.note&&locOf(p.id).kind!=='pool').map(p=>`• ${shortName(p)}: ${p.note}`)];
  if(S.notes)instr.push(S.notes);
  const instrLines=instr.flatMap(t=>wrapLines(meas,t,W-pad*2));
  const subs=S.bench.map(P).filter(Boolean);
  const sp=[['Captain',S.captain],['Corners',S.corners],['Free kicks',S.freeKicks],['Penalties',S.penalties]].filter(x=>P(x[1]));
  const headH=230,subsH=subs.length?60+Math.ceil(subs.length/2)*46:0,spH=sp.length?60+Math.ceil(sp.length/2)*44:0,instrH=instrLines.length?70+instrLines.length*42:0;
  const H=headH+ph+50+subsH+spH+instrH+70;
  const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  ctx.fillStyle='#0f1a14';ctx.fillRect(0,0,W,H);
  // header
  ctx.fillStyle=S.kit;ctx.fillRect(0,0,W,14);
  ctx.fillStyle='#9fb4a6';ctx.font=`600 28px ${DF}`;ctx.textBaseline='alphabetic';
  ctx.fillText(`${S.format}-A-SIDE · ${S.formation}${S.ha?' · '+S.ha.toUpperCase():''}`,pad,78);
  ctx.fillStyle='#ffffff';ctx.font=`700 64px ${DF}`;
  let title=(S.team||'Line-up')+(S.opp?' v '+S.opp:'');
  while(ctx.measureText(title).width>W-pad*2&&ctx.font.match(/(\d+)px/)[1]>36){const sz=+ctx.font.match(/(\d+)px/)[1]-4;ctx.font=`700 ${sz}px ${DF}`}
  ctx.fillText(title,pad,148);
  ctx.fillStyle='#d7e3da';ctx.font=`500 30px ${BF}`;
  const info=[fmtDate(S.date),S.meet&&('Meet '+S.meet),S.ko&&('KO '+S.ko),S.venue].filter(Boolean).join('  ·  ');
  wrapLines(ctx,info,W-pad*2).slice(0,1).forEach((l,i)=>ctx.fillText(l,pad,196));
  // pitch
  const py=headH;
  ctx.save();rr(ctx,px,py,pw,ph,16);ctx.clip();
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#297a42':'#2e8549';ctx.fillRect(px,py+ph*i/10,pw,ph/10+1)}
  ctx.restore();
  const sx=v=>px+v/68*pw,sy=v=>py+v/100*ph;
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;
  const R=(x,y,w,h)=>ctx.strokeRect(sx(x),sy(y),w/68*pw,h/100*ph);
  R(2,2,64,96);R(13.85,2,40.3,15.7);R(24.85,2,18.3,5.2);R(13.85,82.3,40.3,15.7);R(24.85,92.8,18.3,5.2);
  ctx.beginPath();ctx.moveTo(sx(2),sy(50));ctx.lineTo(sx(66),sy(50));ctx.stroke();
  ctx.beginPath();ctx.ellipse(sx(34),sy(50),8.7/68*pw,8.3/100*ph,0,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.ellipse(sx(34),sy(12),8.7/68*pw,8.3/100*ph,0,0.2*Math.PI,0.8*Math.PI);ctx.stroke();
  ctx.beginPath();ctx.ellipse(sx(34),sy(88),8.7/68*pw,8.3/100*ph,0,1.2*Math.PI,1.8*Math.PI);ctx.stroke();
  // tokens
  const tr=Math.round(pw*0.055);
  S.slots.forEach((s,i)=>{
    const x=px+s.x/100*pw,y=py+s.y/100*ph,p=P(s.pid),kit=isGK(i)?S.gkKit:S.kit;
    ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
    ctx.beginPath();ctx.arc(x,y-10,tr,0,Math.PI*2);ctx.fillStyle=p?kit:'rgba(255,255,255,.15)';ctx.fill();ctx.restore();
    ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.setLineDash(p?[]:[8,6]);ctx.beginPath();ctx.arc(x,y-10,tr,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=p?inkFor(kit):'#fff';ctx.font=`700 ${p?34:24}px ${DF}`;ctx.fillText(p?(p.num||''):s.label,x,y-8);
    if(p&&S.captain===p.id){ctx.fillStyle='#f2c12e';rr(ctx,x+tr-14,y-10-tr-6,30,26,6);ctx.fill();ctx.fillStyle='#1b1500';ctx.font=`700 20px ${DF}`;ctx.fillText('C',x+tr+1,y-10-tr+8)}
    const nm=p?shortName(p):'TBC';ctx.font=`600 28px ${DF}`;const w=ctx.measureText(nm).width+20;
    ctx.fillStyle='rgba(8,25,14,.78)';rr(ctx,x-w/2,y+tr-2,w,36,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(nm,x,y+tr+17);
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.font=`600 18px ${DF}`;ctx.fillText(s.label,x,y+tr+48);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
  });
  let y=py+ph+50;
  const heading=(t)=>{ctx.fillStyle='#9fb4a6';ctx.font=`600 26px ${DF}`;ctx.fillText(t.toUpperCase(),pad,y+26);y+=60};
  if(subs.length){heading('Subs');ctx.font=`500 30px ${BF}`;subs.forEach((p,i)=>{const cx=pad+(i%2)*((W-pad*2)/2),cy=y+Math.floor(i/2)*46;
    ctx.fillStyle=S.kit;ctx.beginPath();ctx.arc(cx+17,cy+4,17,0,Math.PI*2);ctx.fill();ctx.fillStyle=inkFor(S.kit);ctx.font=`700 20px ${DF}`;ctx.textAlign='center';ctx.fillText(p.num||'',cx+17,cy+11);ctx.textAlign='left';
    ctx.fillStyle='#fff';ctx.font=`500 30px ${BF}`;ctx.fillText(p.name,cx+48,cy+14)});y+=Math.ceil(subs.length/2)*46}
  if(sp.length){heading('Roles & set pieces');sp.forEach(([k,v],i)=>{const cx=pad+(i%2)*((W-pad*2)/2),cy=y+Math.floor(i/2)*44;ctx.fillStyle='#9fb4a6';ctx.font=`500 26px ${BF}`;ctx.fillText(k,cx,cy+12);ctx.fillStyle='#fff';ctx.font=`600 28px ${BF}`;ctx.fillText(shortName(P(v)),cx+170,cy+12)});y+=Math.ceil(sp.length/2)*44}
  if(instrLines.length){heading('Instructions');ctx.fillStyle='#e8efe9';ctx.font=`500 30px ${BF}`;instrLines.forEach((l,i)=>ctx.fillText(l,pad,y+12+i*42));}
  return c;
}
async function openShare(){
  const msg=messageText();
  openSheet(`<h2>Share line-up</h2><p class="sub">Save the picture and post it in your team's WhatsApp group, or copy the text version.</p>
    <img class="share-img" id="shImg" alt="Line-up image preview">
    <div class="sheet-actions" style="justify-content:flex-start"><button class="btn primary" id="shSave" disabled>Preparing image…</button><button class="btn" id="shCopy">Copy message</button>
      <a class="btn" id="shWa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Open in WhatsApp</a></div>
    <p class="muted" id="shNote">On iPad, Share image opens the share sheet, where you can pick WhatsApp.</p>
    <pre class="share-msg" id="shMsg">${esc(msg)}</pre>
    <div class="sheet-actions"><button class="btn" id="shClose">Close</button></div>`,()=>{
    $('shClose').onclick=closeSheet;
    if(navigator.share){$('shNote').insertAdjacentHTML('beforebegin','<div class="sheet-actions" style="justify-content:flex-start"><button class="btn" id="shText">Share as text</button></div>');$('shText').onclick=()=>navigator.share({text:msg}).catch(()=>{})}
    $('shCopy').onclick=()=>{
      const done=()=>toast('Message copied');
      try{navigator.clipboard.writeText(msg).then(done,()=>{selectMsg();toast('Select all and copy the text below')})}catch(e){selectMsg()}
    };
  });
  const canvas=await buildImage();
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  const img=$('shImg');if(!img)return;
  img.src=URL.createObjectURL(blob);
  const fname=`lineup-${(S.opp||S.team||'team').replace(/[^\w]+/g,'-').toLowerCase()}${S.date?'-'+S.date:''}.png`;
  const file=new File([blob],fname,{type:'image/png'});
  const canShareFile=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  $('shSave').textContent=canShareFile?'Share image':'Save image';
  $('shSave').disabled=false;
  $('shSave').onclick=async()=>{
    if(canShareFile){
      try{await navigator.share({files:[file],title:S.team||'Line-up'});return}
      catch(err){if(err&&err.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=img.src;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    $('shNote').textContent='Image saved. If nothing happened, press and hold the picture to save it.';
  };
}
function selectMsg(){const el=$('shMsg');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}

/* ---------- Wiring ---------- */
$('pitch').addEventListener('pointerdown',onDown);
$('bench').addEventListener('pointerdown',onDown);
$('panelBody').addEventListener('pointerdown',e=>{if(e.target.closest('.pool-item'))onDown(e)});
$('formationSel').onchange=e=>{S.formation=e.target.value;applyFormation(S,true);save();render()};
$('setupBtn').onclick=()=>openSetup(false);
$('shareBtn').onclick=openShare;
$('benchMinus').onclick=()=>{resizeBench(Math.max(0,S.bench.length-1));sel=null;save();render()};
$('benchPlus').onclick=()=>{resizeBench(Math.min(16,S.bench.length+1));save();render()};
$('hintCancel').onclick=()=>{sel=null;render()};
$('hintEdit').onclick=()=>{const l=sel;sel=null;openEditor(l)};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;pendingDelete=null;renderPanel()}};
$('panelBody').addEventListener('click',e=>{
  const t=e.target.closest('[data-tag],[data-kit],[data-gkkit],[data-act]');if(!t)return;
  if(t.dataset.tag){const g=t.dataset.tag;S.tags=S.tags.includes(g)?S.tags.filter(x=>x!==g):[...S.tags,g];save();renderPanel();return}
  if(t.dataset.kit){S.kit=t.dataset.kit;save();render();return}
  if(t.dataset.gkkit){S.gkKit=t.dataset.gkkit;save();render();return}
  const a=t.dataset.act;
  if(a==='addPlayer'){const n=$('newName').value.trim();if(!n){$('newName').focus();return}S.players.push({id:uid(),name:n,num:$('newNum').value.trim(),note:''});S.example=false;save();render();$('newName').focus()}
  else if(a==='bulk')bulkSheet();
  else if(a==='clearExample'){clearSquad();S.team='';S.opp='';S.venue='';S.notes='';S.tags=[];save();render();openSetup(false)}
  else if(a==='resetPos'){applyFormation(S,true);save();render();toast('Positions reset')}
  else if(a==='clearPitch'){S.slots.forEach(s=>s.pid=null);save();render()}
  else if(a==='saveLineup'){const list=store.get(SAVED_KEY)||[];const name=$('saveName').value.trim()||'Line-up';list.unshift({name,at:Date.now(),state:JSON.parse(JSON.stringify(S))});store.set(SAVED_KEY,list.slice(0,30));renderPanel();toast('Line-up saved')}
  else if(a==='load'){const list=store.get(SAVED_KEY)||[];const x=list[+t.dataset.i];if(x){S=JSON.parse(JSON.stringify(x.state));sel=null;save();render();toast('Loaded '+x.name)}}
  else if(a==='delSaved'){const i=+t.dataset.i;if(pendingDelete===i){const list=store.get(SAVED_KEY)||[];list.splice(i,1);store.set(SAVED_KEY,list);pendingDelete=null}else pendingDelete=i;renderPanel()}
});
$('panelBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='newName'||e.target.id==='newNum')){e.preventDefault();$('panelBody').querySelector('[data-act="addPlayer"]').click()}});
$('panelBody').addEventListener('change',e=>{const k=e.target.dataset.bind;if(!k)return;S[k]=e.target.value||(['captain','corners','freeKicks','penalties'].includes(k)?null:'');save();
  if(['team','opp','date','ko','ha'].includes(k)){const keep=document.activeElement&&document.activeElement.id;render();if(keep&&$(keep))$(keep).focus({preventScroll:true})}});
$('panelBody').addEventListener('input',e=>{const k=e.target.dataset.bind;if(k==='notes'||k==='venue'){S[k]=e.target.value;save()}});
// Keyboard: Enter/Space on a player acts like a tap.
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.tok,.bench-slot,.pool-item')){e.preventDefault();tap(parseLoc(e.target.dataset.loc))}});
new MutationObserver(()=>document.querySelectorAll('.tok,.bench-slot,.pool-item').forEach(el=>el.tabIndex=0)).observe(document.body,{childList:true,subtree:true});

render();
if(firstRun){save();openSetup(true)}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
