<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TeamSelect</title>
<meta name="description" content="Pick your team for soccer, Gaelic football or hurling, check who's available, plan fair minutes and share it to WhatsApp.">
<meta name="theme-color" content="#11643d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TeamSelect">
<meta property="og:title" content="TeamSelect">
<meta property="og:description" content="Your team, your position and the match details. No app or login needed.">
<meta property="og:image" content="https://wrynners.github.io/TeamSelect/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" hidden>
  <header class="bar">
    <div class="brand">
      <img class="crest" id="crest" alt="" hidden>
      <div class="brand-text">
        <span class="eyebrow" id="eyebrow">TeamSelect</span>
        <h1 id="title">Team</h1>
      </div>
    </div>
    <div class="tools">
      <label class="sr" for="teamSel">Team</label>
      <select class="pill" id="teamSel"></select>
      <label class="sr" for="formationSel">Formation</label>
      <select class="pill" id="formationSel"></select>
      <button class="btn" id="undoBtn" type="button" disabled aria-label="Undo">Undo</button>
      <button class="btn primary" id="shareBtn" type="button">Share</button>
    </div>
  </header>

  <main class="board">
    <div class="pitch-col">
      <div class="pitch" id="pitch" data-loc="pitcharea">
        <svg class="lines" id="pitchLines" preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="attack" id="attackLbl">Attacking ↑</span>
        <div id="tokens"></div>
      </div>
      <section class="dugout card" aria-label="Substitutes bench">
        <div class="dugout-head">
          <span class="label" id="benchLabel">Bench</span>
          <div class="row">
            <span class="muted">Slots</span>
            <div class="stepper"><button type="button" id="benchMinus" aria-label="Fewer bench slots">−</button><span id="benchCount">5</span><button type="button" id="benchPlus" aria-label="More bench slots">+</button></div>
          </div>
        </div>
        <div class="bench" id="bench"></div>
      </section>
    </div>

    <aside class="panel card">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="squad">Squad</button>
        <button role="tab" aria-selected="false" data-tab="plan">Plan</button>
        <button role="tab" aria-selected="false" data-tab="match">Match</button>
        <button role="tab" aria-selected="false" data-tab="season">Season</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>
</div>

<div id="viewer" class="viewer" hidden></div>
<div id="hint" class="hint" hidden><span id="hintText"></span><button class="btn" id="hintEdit" type="button">Edit</button><button class="btn" id="hintCancel" type="button">Done</button></div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="fileIn" hidden>
<script src="app.js"></script>
</body>
</html>
